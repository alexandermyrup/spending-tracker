name: Update Version Metadata

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Update version.json
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          node <<'EOF'
          const fs = require('fs');
          const path = 'version.json';
          let data = { version: 'v0.2' };
          try {
            data = JSON.parse(fs.readFileSync(path, 'utf8'));
          } catch {}
          data.build = process.env.GITHUB_SHA.slice(0, 7);
          data.commit = process.env.GITHUB_SHA;
          data.updatedAt = new Date().toISOString();
          fs.writeFileSync(path, `${JSON.stringify(data, null, 2)}\n`);
          EOF

      - name: Commit updated version metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git diff --cached --quiet && exit 0
          git commit -m "Update version metadata [skip ci]"
          git push

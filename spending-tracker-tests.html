<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spending Tracker - Test Suite</title>
<style>
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace; background: #f5f5f5; padding: 20px; }
.test-container { max-width: 1200px; margin: 0 auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); overflow: hidden; }
.header { background: #2c3e50; color: #fff; padding: 20px; }
.header h1 { margin: 0; font-size: 24px; }
.header p { margin: 5px 0 0 0; opacity: 0.8; font-size: 14px; }
.test-suite { border-bottom: 1px solid #e0e0e0; }
.test-suite-header { background: #34495e; color: #fff; padding: 12px 20px; font-weight: 600; font-size: 14px; text-transform: uppercase; cursor: pointer; user-select: none; }
.test-suite-header:hover { background: #2c3e50; }
.test-suite-header.collapsed::before { content: '▶ '; }
.test-suite-header.expanded::before { content: '▼ '; }
.test-list { padding: 10px 20px; background: #fafafa; display: none; }
.test-list.visible { display: block; }
.test-item { padding: 10px; margin: 5px 0; border-radius: 4px; border-left: 4px solid #ddd; background: #fff; font-size: 13px; }
.test-item.pass { background: #d4edda; border-left-color: #28a745; color: #155724; }
.test-item.fail { background: #f8d7da; border-left-color: #dc3545; color: #721c24; }
.test-item.pending { background: #fff3cd; border-left-color: #ffc107; color: #856404; }
.test-code { font-family: 'Courier New', monospace; font-size: 12px; margin-top: 5px; background: #f0f0f0; padding: 8px; border-radius: 3px; overflow-x: auto; display: block; }
.summary { padding: 20px; background: #fff; border-top: 2px solid #e0e0e0; }
.summary-row { display: flex; gap: 30px; margin-bottom: 10px; font-size: 14px; }
.summary-row span { font-weight: 600; }
.pass-count { color: #28a745; }
.fail-count { color: #dc3545; }
.pending-count { color: #ffc107; }
.progress-bar { height: 4px; background: #e0e0e0; border-radius: 2px; margin: 10px 0; overflow: hidden; }
.progress-fill { height: 100%; background: #28a745; }
.error-msg { font-size: 12px; margin-top: 5px; padding: 8px; background: #ffebee; border-left: 3px solid #dc3545; color: #c62828; }
</style>
</head>
<body>

<div class="test-container">
  <div class="header">
    <h1>Spending Tracker - Automated Test Suite</h1>
    <p>Comprehensive tests for core JavaScript logic</p>
  </div>

  <div id="test-suites"></div>

  <div class="summary">
    <div class="summary-row">
      <span>Total Tests: <span id="total-count">0</span></span>
      <span class="pass-count">Passed: <span id="pass-count">0</span></span>
      <span class="fail-count">Failed: <span id="fail-count">0</span></span>
      <span class="pending-count">Pending: <span id="pending-count">0</span></span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
  </div>
</div>

<script>
// ============ TEST FRAMEWORK ============
class TestRunner {
  constructor() {
    this.suites = [];
    this.results = { pass: 0, fail: 0, pending: 0, tests: [] };
  }

  suite(name, fn) {
    const tests = [];
    const suite = { name, tests };
    this.suites.push(suite);

    const test = (testName, testFn) => {
      tests.push({ name: testName, fn: testFn });
    };
    test.skip = (testName, testFn) => {
      tests.push({ name: testName, fn: testFn, skip: true });
    };

    fn(test);
  }

  async run() {
    for (const suite of this.suites) {
      for (const test of suite.tests) {
        try {
          if (test.skip) {
            this.results.pending++;
            this.results.tests.push({ suite: suite.name, name: test.name, status: 'pending' });
          } else {
            await test.fn();
            this.results.pass++;
            this.results.tests.push({ suite: suite.name, name: test.name, status: 'pass' });
          }
        } catch (e) {
          this.results.fail++;
          this.results.tests.push({ suite: suite.name, name: test.name, status: 'fail', error: e.message });
        }
      }
    }
    this.render();
  }

  render() {
    const suitesContainer = document.getElementById('test-suites');
    const suitesByName = {};

    for (const test of this.results.tests) {
      if (!suitesByName[test.suite]) {
        suitesByName[test.suite] = [];
      }
      suitesByName[test.suite].push(test);
    }

    let html = '';
    for (const [suiteName, tests] of Object.entries(suitesByName)) {
      const suitePass = tests.filter(t => t.status === 'pass').length;
      const suiteFail = tests.filter(t => t.status === 'fail').length;

      html += `<div class="test-suite">
        <div class="test-suite-header expanded" onclick="toggleSuite(this)">${suiteName} (${suitePass}/${tests.length})</div>
        <div class="test-list visible">`;

      for (const test of tests) {
        const statusClass = test.status === 'pass' ? 'pass' : test.status === 'fail' ? 'fail' : 'pending';
        const icon = test.status === 'pass' ? '✓' : test.status === 'fail' ? '✗' : '○';
        html += `<div class="test-item ${statusClass}">
          <span>${icon}</span> ${test.name}`;
        if (test.error) {
          html += `<code class="test-code">Error: ${escapeHtml(test.error)}</code>`;
        }
        html += `</div>`;
      }

      html += `</div></div>`;
    }

    suitesContainer.innerHTML = html;

    // Update summary
    document.getElementById('total-count').textContent = this.results.tests.length;
    document.getElementById('pass-count').textContent = this.results.pass;
    document.getElementById('fail-count').textContent = this.results.fail;
    document.getElementById('pending-count').textContent = this.results.pending;

    const total = this.results.tests.length || 1;
    const pct = (this.results.pass / total * 100).toFixed(0);
    document.getElementById('progress-fill').style.width = pct + '%';
  }
}

function toggleSuite(el) {
  const list = el.nextElementSibling;
  list.classList.toggle('visible');
  el.classList.toggle('expanded');
  el.classList.toggle('collapsed');
}

function escapeHtml(text) {
  const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  return text.replace(/[&<>"']/g, m => map[m]);
}

// Simple assertion helpers
function assert(condition, message) {
  if (!condition) throw new Error(message || 'Assertion failed');
}
function assertEquals(actual, expected, message) {
  if (actual !== expected) {
    throw new Error(`${message || 'Assertion failed'}: expected ${expected}, got ${actual}`);
  }
}
function assertDeepEqual(actual, expected, message) {
  const actualStr = JSON.stringify(actual);
  const expectedStr = JSON.stringify(expected);
  if (actualStr !== expectedStr) {
    throw new Error(`${message || 'Assertion failed'}: expected ${expectedStr}, got ${actualStr}`);
  }
}
function assertArrayIncludes(arr, item, message) {
  if (!arr.includes(item)) {
    throw new Error(`${message || 'Assertion failed'}: ${JSON.stringify(arr)} does not include ${item}`);
  }
}

// ============ SETUP & MOCKS ============
let store = { transactions: [], categories: {}, budgets: {}, merchantMap: {}, nextId: 1 };
let pendingImport = [];

const STORAGE_KEY = 'spending-tracker-v2';
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTH_KEYS = ['01','02','03','04','05','06','07','08','09','10','11','12'];
const CHART_COLORS = ['#2563eb','#7c3aed','#db2777','#ea580c','#16a34a','#0891b2','#4f46e5','#c026d3','#d97706','#059669','#6366f1','#e11d48'];

const DEFAULT_CATEGORIES = {
  "Fixed costs": ["Rent + utilities","Transport","Mobile","Internet","Contacts","Macbook payment","Gym","KAB venteliste"],
  "Subscriptions": ["OpenAI","iCloud","F1TV","EA Play Pro","M365","Google","WHOOP"],
  "Insurance": ["Hövding forsikring","Accident insurance","Sygesikring Danmark"],
  "Variable": ["Groceries","Eating out","Nightlife","Travel","Skincare","Vitamins","Pharmacy","Toiletries","Clothes","Laundry","Haircut","Tandlæge","Gift cost","Transfer out","Fun","Other"],
  "Savings": ["Pension","Investments"],
  "Income": ["SU","Part-time job","Feriepenge","Reimbursement","Interest","Other income"]
};

const SPENDING_GROUPS = ['Fixed costs','Subscriptions','Insurance','Variable'];
const INCOME_GROUP = 'Income';
const SAVINGS_GROUP = 'Savings';

const MERCHANT_PATTERNS = [
  { p: 'FOETEX', c: 'Groceries', t: 'spending' },
  { p: 'DSB', c: 'Transport', t: 'spending' },
  { p: 'FK-Feriepenge', c: 'Feriepenge', t: 'income' },
  { p: 'SU', c: 'SU', t: 'income', x: true },
  { p: 'Nordnet', c: 'Investments', t: 'saving' },
];

// Mock localStorage
const mockStorage = {};
const localStorage = {
  getItem: (key) => mockStorage[key] || null,
  setItem: (key, value) => { mockStorage[key] = value; },
  clear: () => { Object.keys(mockStorage).forEach(k => delete mockStorage[k]); }
};

const ORIGINAL_PATTERNS = JSON.parse(JSON.stringify(MERCHANT_PATTERNS));

function resetStore() {
  store = { transactions: [], categories: {}, budgets: {}, merchantMap: {}, nextId: 1 };
  store.categories = JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));
  store.budgets = { "2026": getDefaultYearBudget() };
  pendingImport = [];
  localStorage.clear();
  // Restore MERCHANT_PATTERNS to original state (tests may mutate it)
  MERCHANT_PATTERNS.length = 0;
  ORIGINAL_PATTERNS.forEach(p => MERCHANT_PATTERNS.push(JSON.parse(JSON.stringify(p))));
}

// ============ CORE FUNCTIONS (from spending-tracker.html) ============

function autoMatchMerchant(merchantName, amount) {
  const upper = merchantName.toUpperCase();
  if (store.merchantMap[upper]) {
    const mapped = store.merchantMap[upper];
    const isIncomeCategory = getIncomeCategories().has(mapped.category) || mapped.type === 'income';
    const isPositive = amount && amount > 0;
    if (isIncomeCategory && !isPositive) { /* skip */ }
    else if (!isIncomeCategory && isPositive && mapped.type === 'spending') { /* skip */ }
    else return mapped;
  }
  if (upper.includes('LØNOVERFØRSEL')) return { category: 'Part-time job', type: 'income' };
  if (upper === 'SAVINGS ACCOUNT' || upper === 'FROM SAVINGS ACCOUNT' || upper.includes('SAVINGS SU LÅN')) return { category: '', type: 'ignore' };
  if (upper.includes('IVAN BARBER')) return { category: 'Haircut', type: 'spending' };
  const knownInstitutions = ['UDBETALING DANMARK', 'SYGESIKRING DANMARK', 'TOPDANMARK'];
  const looksLikePerson = !knownInstitutions.some(inst => upper.includes(inst)) && (upper.includes('MOBILEPAY') || merchantName.match(/^[A-ZÆØÅ][a-zæøå]+ [A-ZÆØÅ]/));
  if (looksLikePerson && amount) {
    if (amount > 0) return { category: 'Reimbursement', type: 'income' };
    if (amount < 0) return { category: 'Transfer out', type: 'spending' };
  }
  for (const rule of MERCHANT_PATTERNS) {
    const matched = rule.x ? upper === rule.p.toUpperCase() : upper.includes(rule.p.toUpperCase());
    if (matched) {
      if (amount) {
        if (rule.t === 'income' && amount < 0) continue;
        if (rule.t === 'spending' && amount > 0) continue;
      }
      return { category: rule.c, type: rule.t };
    }
  }
  return null;
}

function getDefaultYearBudget() {
  const b = {};
  const defaults = {
    "Rent + utilities": 4800, "Transport": 710, "Groceries": 3200, "Eating out": 300,
    "Investments": 3000, "SU": 0, "Part-time job": 0, "Reimbursement": 0
  };
  const allCats = [];
  Object.values(DEFAULT_CATEGORIES).forEach(cats => allCats.push(...cats));
  allCats.forEach(cat => {
    b[cat] = {};
    MONTH_KEYS.forEach(m => {
      b[cat][m] = defaults[cat] || 0;
    });
  });
  return b;
}

function getIncomeCategories() {
  return new Set([
    ...(DEFAULT_CATEGORIES[INCOME_GROUP] || []),
    ...((store.categories && store.categories[INCOME_GROUP]) || [])
  ]);
}

function sanitizeTransactions() {
  let fixed = 0;
  const incomeCats = getIncomeCategories();
  store.transactions.forEach(tx => {
    if (!tx.category || tx.type === 'ignore' || tx.manualCategory) return;
    const isPositive = tx.amount > 0;
    const isIncomeCat = incomeCats.has(tx.category);
    if (isPositive && !isIncomeCat) {
      tx.category = ''; fixed++;
    } else if (!isPositive && isIncomeCat) {
      tx.category = ''; fixed++;
    }
  });
  return fixed;
}

function parseNordeaCSV(text) {
  text = text.replace(/^\uFEFF/, '');
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  if (lines.length < 2) return [];
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    const cols = lines[i].split(';');
    if (cols.length < 6) continue;
    const dateRaw = cols[0].trim();
    const amount = parseFloat(cols[1].replace(/\./g, '').replace(',', '.'));
    if (isNaN(amount)) continue;
    const name = cols[4].trim();
    const desc = cols[5].trim();
    const saldo = cols[6] ? cols[6].trim() : '';
    let date = dateRaw;
    if (dateRaw === 'Reserveret') date = new Date().toISOString().slice(0, 10);
    else date = dateRaw.replace(/\//g, '-');
    const merchant = resolveMerchant(name, desc);
    rows.push({ date, amount, merchant, description: desc, originalName: name, balance: saldo, pending: dateRaw === 'Reserveret' });
  }
  return rows;
}

function txFingerprint(tx) {
  return `${tx.date}|${tx.amount}|${tx.merchant}|${tx.description}`;
}

function resolveMerchant(name, desc) {
  const n = (name || '').trim();
  const d = (desc || '').trim();
  const upper = n.toUpperCase();
  if (upper.includes('VIPPS') || upper.includes('MOBILEPAY')) {
    return d.replace(/^MobilePay\s+/i, '').trim() || n || 'Unknown';
  }
  if (d.toUpperCase().includes('NORDEAPAY')) {
    return n || d || 'Unknown';
  }
  return n || d || 'Unknown';
}

function selectCategory(txId, category) {
  const tx = store.transactions.find(t => t.id === txId);
  if (tx) {
    tx.category = category;
    tx.manualCategory = !!category;
    if (category) {
      store.merchantMap[tx.merchant.toUpperCase()] = { category, type: tx.type };
    } else {
      delete store.merchantMap[tx.merchant.toUpperCase()];
      tx.manualCategory = false;
    }
  }
}

function setTxType(id, type) {
  const tx = store.transactions.find(t => t.id === id);
  if (tx) {
    tx.type = type;
    if (tx.category && store.merchantMap[tx.merchant.toUpperCase()]) {
      store.merchantMap[tx.merchant.toUpperCase()].type = type;
    }
  }
}

function renameCat(oldName, newName) {
  for (const [group, cats] of Object.entries(store.categories)) {
    const idx = cats.indexOf(oldName);
    if (idx >= 0) {
      store.categories[group][idx] = newName;
      break;
    }
  }
  store.transactions.forEach(t => { if (t.category === oldName) t.category = newName; });
  Object.keys(store.budgets).forEach(yr => {
    if (store.budgets[yr][oldName]) {
      store.budgets[yr][newName] = store.budgets[yr][oldName];
      delete store.budgets[yr][oldName];
    }
  });
  Object.keys(store.merchantMap).forEach(k => {
    if (store.merchantMap[k].category === oldName) store.merchantMap[k].category = newName;
  });
  MERCHANT_PATTERNS.forEach(rule => { if (rule.c === oldName) rule.c = newName; });
}

function deleteCat(name) {
  for (const [group, cats] of Object.entries(store.categories)) {
    store.categories[group] = cats.filter(c => c !== name);
  }
  store.transactions.forEach(t => { if (t.category === name) { t.category = ''; t.manualCategory = false; } });
  Object.keys(store.merchantMap).forEach(k => { if (store.merchantMap[k].category === name) delete store.merchantMap[k]; });
  MERCHANT_PATTERNS.forEach(rule => { if (rule.c === name) rule.c = ''; });
  Object.keys(store.budgets).forEach(yr => { delete store.budgets[yr][name]; });
}

function confirmSplit(txId, parts) {
  const tx = store.transactions.find(t => t.id === txId);
  if (!tx) return;
  const childIds = [];
  const sign = tx.amount > 0 ? 1 : -1;
  parts.forEach(p => {
    const cat = p.category || '';
    const amt = (parseFloat(p.amount) || 0) * sign;
    const type = p.type;
    const childId = store.nextId++;
    childIds.push(childId);
    store.transactions.push({
      id: childId, date: tx.date, amount: amt, merchant: tx.merchant,
      description: tx.description, balance: tx.balance, pending: tx.pending,
      category: cat, type: type, covered: tx.covered,
      splitFrom: tx.id
    });
  });
  tx.splitInto = childIds;
  tx.type = 'ignore';
  return childIds;
}

// ============ EXTRACTED PURE FUNCTIONS ============

function getFilteredTransactions(filters, transactions) {
  const search = (filters.search || '').toLowerCase();
  const txs = transactions.filter(tx => {
    if (filters.month !== 'all' && !tx.date.startsWith(filters.month)) return false;
    if (filters.category !== 'all' && tx.category !== filters.category) return false;
    if (filters.type !== 'all' && tx.type !== filters.type) return false;
    if (filters.uncategorizedOnly && (tx.category || tx.type === 'ignore')) return false;
    if (search && !tx.merchant.toLowerCase().includes(search) && !tx.description.toLowerCase().includes(search)) return false;
    return true;
  });
  const totalSpending = Math.abs(txs.filter(t => t.amount < 0 && t.type === 'spending').reduce((s, t) => s + t.amount, 0));
  const totalIncome = txs.filter(t => t.amount > 0).reduce((s, t) => s + t.amount, 0);
  const duplicateFingerprints = {};
  transactions.forEach(tx => {
    if (tx.splitInto || tx.splitFrom) return;
    const fp = txFingerprint(tx);
    duplicateFingerprints[fp] = (duplicateFingerprints[fp] || 0) + 1;
  });
  const filtered = txs.filter(tx => !tx.splitInto).sort((a, b) => {
    if (filters.uncategorizedOnly) {
      const aHasCat = !!a.category;
      const bHasCat = !!b.category;
      if (aHasCat !== bHasCat) return aHasCat ? 1 : -1;
      if (!aHasCat && !bHasCat) {
        const aSug = !!autoMatchMerchant(a.merchant, a.amount);
        const bSug = !!autoMatchMerchant(b.merchant, b.amount);
        if (aSug !== bSug) return aSug ? -1 : 1;
      }
    }
    return b.date.localeCompare(a.date) || b.id - a.id;
  });
  return { filtered, totalSpending, totalIncome, duplicateFingerprints };
}

function getEffectiveMonth(t, shiftDay) {
  const raw = t.date.slice(0, 7);
  if (!shiftDay) return raw;
  const isIncome = t.type === 'income' || (t.amount > 0 && t.type !== 'ignore' && t.type !== 'loan');
  const shouldShift = isIncome || t.type === 'saving';
  if (!shouldShift) return raw;
  const day = parseInt(t.date.slice(8, 10), 10);
  if (day <= shiftDay) return raw;
  const year = parseInt(t.date.slice(0, 4), 10);
  const month = parseInt(t.date.slice(5, 7), 10);
  if (month === 12) return `${year + 1}-01`;
  return `${year}-${String(month + 1).padStart(2, '0')}`;
}

function getYearlyDashboardData(year, options) {
  const excludeCovered = options.excludeCovered;
  const transactions = options.transactions;
  const budgets = options.budgets;
  const categories = options.categories;
  const loanBudgetMap = options.loanBudget;
  const currentDate = options.currentDate || new Date();
  const shiftDay = options.salaryShiftDay || 0;

  const yb = (budgets && budgets[year]) || {};
  const annualLoanBudget = (loanBudgetMap && loanBudgetMap[year]) || 0;

  const currentYear = currentDate.getFullYear();
  const currentMonthIdx = (parseInt(year) === currentYear) ? currentDate.getMonth() : 11;

  const catTotals = {};
  const monthData = MONTH_KEYS.map((mk, i) => {
    const ym = `${year}-${mk}`;
    let txs = transactions.filter(t => !t.splitInto && getEffectiveMonth(t, shiftDay) === ym);
    if (excludeCovered) txs = txs.filter(t => !t.covered);
    const spend = Math.abs(txs.filter(t => t.type === 'spending' && t.amount < 0).reduce((s, t) => s + t.amount, 0));
    const save = Math.abs(txs.filter(t => t.type === 'saving' && t.amount < 0).reduce((s, t) => s + t.amount, 0));
    const inc = txs.filter(t => t.type === 'income' || (t.amount > 0 && t.type !== 'ignore' && t.type !== 'loan')).reduce((s, t) => s + t.amount, 0);
    const loan = txs.filter(t => t.type === 'loan').reduce((s, t) => s + t.amount, 0);

    const hasActuals = txs.length > 0;
    if (hasActuals) {
      txs.filter(t => t.type === 'spending' && t.amount < 0).forEach(t => {
        const cat = t.category || 'Uncategorized';
        catTotals[cat] = (catTotals[cat] || 0) + Math.abs(t.amount);
      });
    }

    let budget = 0;
    Object.entries(categories).forEach(([group, cats]) => {
      if (group === SAVINGS_GROUP || group === INCOME_GROUP) return;
      cats.forEach(cat => { budget += (yb[cat] && yb[cat][mk]) || 0; });
    });

    const isPast = i <= currentMonthIdx || parseInt(year) < currentYear;
    return { mk, ym, month: MONTHS[i], spend, save, inc, loan, budget, hasActuals, isPast };
  });

  const ytdMonths = monthData.filter(m => m.hasActuals);
  const ytdSpend = ytdMonths.reduce((s, m) => s + m.spend, 0);
  const ytdSave = ytdMonths.reduce((s, m) => s + m.save, 0);
  const ytdIncome = ytdMonths.reduce((s, m) => s + m.inc, 0);
  const ytdLoan = ytdMonths.reduce((s, m) => s + m.loan, 0);
  const ytdRemaining = ytdIncome - ytdSpend - ytdSave;

  const annualBudget = monthData.reduce((s, m) => s + m.budget, 0);
  const ytdBudget = ytdMonths.reduce((s, m) => s + m.budget, 0);

  const futureMonths = monthData.filter(m => !m.hasActuals && m.isPast === false);
  const forecastSpend = ytdSpend + futureMonths.reduce((s, m) => s + m.budget, 0);
  const avgMonthlyIncome = ytdMonths.length > 0 ? ytdIncome / ytdMonths.length : 0;
  const forecastIncome = ytdIncome + (futureMonths.length * avgMonthlyIncome);
  const avgMonthlySave = ytdMonths.length > 0 ? ytdSave / ytdMonths.length : 0;
  const forecastSave = ytdSave + (futureMonths.length * avgMonthlySave);
  const monthlyLoanBudget = annualLoanBudget / 12;
  const forecastLoan = ytdLoan + (futureMonths.length * monthlyLoanBudget);
  const forecastRemaining = forecastIncome - forecastSpend - forecastSave;

  const catBudgets = {};
  Object.entries(categories).forEach(([group, cats]) => {
    if (group === SAVINGS_GROUP || group === INCOME_GROUP) return;
    cats.forEach(cat => {
      let total = 0;
      MONTH_KEYS.forEach(mk => { total += (yb[cat] && yb[cat][mk]) || 0; });
      if (total > 0) catBudgets[cat] = total;
    });
  });

  return {
    monthData,
    ytd: { spend: ytdSpend, save: ytdSave, income: ytdIncome, loan: ytdLoan, remaining: ytdRemaining, budget: ytdBudget, monthCount: ytdMonths.length },
    annual: { budget: annualBudget, avgSpend: ytdMonths.length > 0 ? ytdSpend / ytdMonths.length : 0, avgIncome: avgMonthlyIncome },
    forecast: { spend: forecastSpend, income: forecastIncome, save: forecastSave, loan: forecastLoan, remaining: forecastRemaining, futureMonthCount: futureMonths.length },
    catTotals,
    catBudgets,
    annualLoanBudget,
    ytdLoanBudget: monthlyLoanBudget * ytdMonths.length
  };
}

runner.suite('Dashboard Calculations', (test) => {
  test('Monthly: income excludes loans', () => {
    resetStore();
    store.transactions.push(
      { id: 1, date: '2026-02-15', amount: 5000, merchant: 'Employer', description: 'Salary', category: 'Part-time job', type: 'income', covered: false },
      { id: 2, date: '2026-02-15', amount: 3000, merchant: 'SU', description: 'Loan', category: '', type: 'loan', covered: false }
    );
    const txs = store.transactions.filter(t => t.date.startsWith('2026-02') && !t.splitInto);
    const income = txs.filter(t => (t.type === 'income' || (t.amount > 0 && t.type !== 'ignore' && t.type !== 'loan')));
    const totalIncome = income.reduce((s, t) => s + t.amount, 0);
    assertEquals(totalIncome, 5000, 'Income should exclude loan');
  });

  test('Monthly: spending is absolute value of negatives', () => {
    resetStore();
    store.transactions.push(
      { id: 1, date: '2026-02-15', amount: -150, merchant: 'FOETEX', description: 'Groceries', category: 'Groceries', type: 'spending', covered: false },
      { id: 2, date: '2026-02-15', amount: -50, merchant: 'Gym', description: 'Membership', category: 'Gym', type: 'spending', covered: false }
    );
    const txs = store.transactions.filter(t => t.date.startsWith('2026-02') && !t.splitInto);
    const spending = txs.filter(t => t.type === 'spending' && t.amount < 0);
    const totalSpend = Math.abs(spending.reduce((s, t) => s + t.amount, 0));
    assertEquals(totalSpend, 200, 'Spending should be absolute value');
  });

  test('Monthly: remaining = income - spending - savings', () => {
    resetStore();
    store.transactions.push(
      { id: 1, date: '2026-02-15', amount: 5000, merchant: 'Employer', description: 'Salary', category: 'Part-time job', type: 'income', covered: false },
      { id: 2, date: '2026-02-15', amount: -200, merchant: 'FOETEX', description: 'Groceries', category: 'Groceries', type: 'spending', covered: false },
      { id: 3, date: '2026-02-15', amount: -1000, merchant: 'Investments', description: 'ISK', category: 'Investments', type: 'saving', covered: false }
    );
    const txs = store.transactions.filter(t => t.date.startsWith('2026-02') && !t.splitInto);
    const income = txs.filter(t => (t.type === 'income' || (t.amount > 0 && t.type !== 'ignore' && t.type !== 'loan'))).reduce((s, t) => s + t.amount, 0);
    const spending = Math.abs(txs.filter(t => t.type === 'spending' && t.amount < 0).reduce((s, t) => s + t.amount, 0));
    const saving = Math.abs(txs.filter(t => t.type === 'saving' && t.amount < 0).reduce((s, t) => s + t.amount, 0));
    const remaining = income - spending - saving;
    assertEquals(remaining, 3800, 'Remaining should be 5000 - 200 - 1000');
  });
});

      { id: 1, date: '2026-02-15', amount: -100, merchant: 'A', description: '', category: '', type: 'spending', covered: false },
      { id: 2, date: '2026-02-15', amount: -200, merchant: 'B', description: '', category: '', type: 'saving', covered: false },
      { id: 3, date: '2026-02-15', amount: 5000, merchant: 'C', description: '', category: '', type: 'income', covered: false }
    );
    const result = getFilteredTransactions(
      { month: 'all', category: 'all', type: 'saving', uncategorizedOnly: false, search: '' },

    );

  test('Uncategorized-only filter excludes categorized and ignored', () => {

      { month: 'all', category: 'all', type: 'all', uncategorizedOnly: true, search: '' },

    );

  test('Search filters by merchant and description', () => {
    resetStore();

      { id: 1, date: '2026-02-15', amount: -100, merchant: 'FOETEX', description: 'Groceries', category: '', type: 'spending', covered: false },

    );
    const result = getFilteredTransactions(
      { month: 'all', category: 'all', type: 'all', uncategorizedOnly: false, search: 'grocer' },
      store.transactions
    );
    assertEquals(result.filtered.length, 2, 'Should match 2 transactions with "grocer"');
  });

  test('Excludes split parent transactions', () => {
    resetStore();
    store.transactions.push(
      { id: 1, date: '2026-02-15', amount: -300, merchant: 'FOETEX', description: 'Mixed', category: '', type: 'ignore', covered: false, splitInto: [2, 3] },
      { id: 2, date: '2026-02-15', amount: -200, merchant: 'FOETEX', description: 'Mixed', category: 'Groceries', type: 'spending', covered: false, splitFrom: 1 },
      { id: 3, date: '2026-02-15', amount: -100, merchant: 'FOETEX', description: 'Mixed', category: 'Eating out', type: 'spending', covered: false, splitFrom: 1 }
    );
    const result = getFilteredTransactions(
      { month: 'all', category: 'all', type: 'all', uncategorizedOnly: false, search: '' },
      store.transactions
    );
    assert(!result.filtered.find(tx => tx.id === 1), 'Should not contain split parent');
    assert(result.filtered.find(tx => tx.id === 2), 'Should contain child id:2');
    assert(result.filtered.find(tx => tx.id === 3), 'Should contain child id:3');
  });

  test('Duplicate fingerprint detection', () => {
    resetStore();
    store.transactions.push(
      { id: 1, date: '2026-02-15', amount: -150, merchant: 'FOETEX', description: 'Groceries', category: '', type: 'spending', covered: false },
      { id: 2, date: '2026-02-15', amount: -150, merchant: 'FOETEX', description: 'Groceries', category: '', type: 'spending', covered: false },
      { id: 3, date: '2026-02-16', amount: -200, merchant: 'DSB', description: 'Train', category: '', type: 'spending', covered: false }
    );
    const result = getFilteredTransactions(
      { month: 'all', category: 'all', type: 'all', uncategorizedOnly: false, search: '' },
      store.transactions
    );
    const dupFp = txFingerprint(store.transactions[0]);
    assert(result.duplicateFingerprints[dupFp] === 2, 'Duplicate fingerprint should have count 2');
    const uniqueFp = txFingerprint(store.transactions[2]);
    assert(!result.duplicateFingerprints[uniqueFp] || result.duplicateFingerprints[uniqueFp] === 1, 'Unique fingerprint should not be flagged as duplicate');
  });

  test('Summary totals are correct', () => {
    resetStore();
    store.transactions.push(
      { id: 1, date: '2026-02-15', amount: -150, merchant: 'A', description: '', category: '', type: 'spending', covered: false },
      { id: 2, date: '2026-02-15', amount: -50, merchant: 'B', description: '', category: '', type: 'spending', covered: false },
      { id: 3, date: '2026-02-15', amount: 5000, merchant: 'C', description: '', category: '', type: 'income', covered: false },
      { id: 4, date: '2026-02-15', amount: -1000, merchant: 'D', description: '', category: '', type: 'saving', covered: false }
    );
    const result = getFilteredTransactions(
      { month: 'all', category: 'all', type: 'all', uncategorizedOnly: false, search: '' },
      store.transactions
    );
    assertEquals(result.totalSpending, 200, 'totalSpending should be 200 (absolute value)');
    assertEquals(result.totalIncome, 5000, 'totalIncome should be 5000');
  });

  test('Uncategorized mode sorts suggestions first', () => {
    resetStore();
    store.transactions.push(
      { id: 1, date: '2026-02-15', amount: -100, merchant: 'FOETEX', description: 'Groceries', category: '', type: 'spending', covered: false },
      { id: 2, date: '2026-02-15', amount: -50, merchant: 'XYZSHOP', description: 'Mystery', category: '', type: 'spending', covered: false },
      { id: 3, date: '2026-02-15', amount: -75, merchant: 'DSB', description: 'Train', category: '', type: 'spending', covered: false }
    );
    const result = getFilteredTransactions(
      { month: 'all', category: 'all', type: 'all', uncategorizedOnly: true, search: '' },
      store.transactions
    );
    // FOETEX and DSB have pattern matches, Unknown Shop does not
    assert(result.filtered.length === 3, 'Should return 3 uncategorized');
    assert(result.filtered[0].merchant === 'FOETEX' || result.filtered[0].merchant === 'DSB', 'First should be a suggestion match');
    assert(result.filtered[1].merchant === 'FOETEX' || result.filtered[1].merchant === 'DSB', 'Second should be a suggestion match');
    assertEquals(result.filtered[2].merchant, 'XYZSHOP', 'XYZSHOP should be last (no suggestion)');
  });
});

runner.suite('Salary month-shift rule', (test) => {
  test('Income on Jan 28 with shift=25 → Feb', () => {
    const t = { date: '2026-01-28', amount: 15000, type: 'income' };
    assertEquals(getEffectiveMonth(t, 25), '2026-02', 'Should shift to Feb');
  });

  test('Income on Jan 15 with shift=25 → Jan (before cutoff)', () => {
    const t = { date: '2026-01-15', amount: 15000, type: 'income' };
    assertEquals(getEffectiveMonth(t, 25), '2026-01', 'Should stay in Jan');
  });

  test('Income on Jan 25 with shift=25 → Jan (day <= shiftDay)', () => {
    const t = { date: '2026-01-25', amount: 15000, type: 'income' };
    assertEquals(getEffectiveMonth(t, 25), '2026-01', 'Should stay in Jan');
  });

  test('Income on Dec 28 with shift=25 → Jan next year', () => {
    const t = { date: '2026-12-28', amount: 15000, type: 'income' };
    assertEquals(getEffectiveMonth(t, 25), '2027-01', 'Should roll over to Jan next year');
  });

  test('Any income with shift=0 → raw month', () => {
    const t = { date: '2026-01-28', amount: 15000, type: 'income' };
    assertEquals(getEffectiveMonth(t, 0), '2026-01', 'Shift off returns raw month');
  });

  test('Spending on Jan 28 with shift=25 → Jan (not income)', () => {
    const t = { date: '2026-01-28', amount: -3000, type: 'spending' };
    assertEquals(getEffectiveMonth(t, 25), '2026-01', 'Spending should not shift');
  });

  test('Loan on Jan 28 with shift=25 → Jan (not income)', () => {
    const t = { date: '2026-01-28', amount: 50000, type: 'loan' };
    assertEquals(getEffectiveMonth(t, 25), '2026-01', 'Loan should not shift');
  });

  test('Saving on Jan 28 with shift=25 → Feb (shifts like income)', () => {
    const t = { date: '2026-01-28', amount: -3000, type: 'saving' };
    assertEquals(getEffectiveMonth(t, 25), '2026-02', 'Saving should shift to Feb');
  });

  test('Ignore-type positive amount with shift=25 → raw month', () => {
    const t = { date: '2026-01-28', amount: 500, type: 'ignore' };
    assertEquals(getEffectiveMonth(t, 25), '2026-01', 'Ignore type should not shift');
  });

  test('Yearly dashboard with shifted income shows in correct month', () => {
    resetStore();
    store.transactions.push(
      { id: 1, date: '2026-01-28', amount: 15000, merchant: 'Employer', description: 'Salary', category: 'Part-time job', type: 'income', covered: false },
      { id: 2, date: '2026-01-15', amount: -3000, merchant: 'FOETEX', description: 'Groceries', category: 'Groceries', type: 'spending', covered: false }
    );
    store.nextId = 3;
    const result = getYearlyDashboardData("2026", {
      excludeCovered: false, transactions: store.transactions,
      budgets: store.budgets, categories: store.categories,
      loanBudget: store.loanBudget || {}, currentDate: new Date("2026-03-01"),
      salaryShiftDay: 25
    });
    assertEquals(result.monthData[0].inc, 0, 'Jan income should be 0 (shifted to Feb)');
    assertEquals(result.monthData[1].inc, 15000, 'Feb income should be 15000');
    assertEquals(result.monthData[0].spend, 3000, 'Jan spending should stay in Jan');
  });

  test('Monthly dashboard filter respects shifted income', () => {
    resetStore();
    store.transactions.push(
      { id: 1, date: '2026-01-28', amount: 15000, merchant: 'Employer', description: 'Salary', category: 'Part-time job', type: 'income', covered: false },
      { id: 2, date: '2026-01-10', amount: 5000, merchant: 'SU', description: 'SU', category: 'SU', type: 'income', covered: false }
    );
    store.nextId = 3;
    // With shift=25, Jan 28 income should move to Feb, but Jan 10 stays in Jan
    const shiftDay = 25;
    const janTxs = store.transactions.filter(t => !t.splitInto && getEffectiveMonth(t, shiftDay) === '2026-01');
    const febTxs = store.transactions.filter(t => !t.splitInto && getEffectiveMonth(t, shiftDay) === '2026-02');
    assertEquals(janTxs.length, 1, 'Jan should have 1 transaction');
    assertEquals(janTxs[0].amount, 5000, 'Jan transaction should be the SU payment');
    assertEquals(febTxs.length, 1, 'Feb should have 1 transaction');
    assertEquals(febTxs[0].amount, 15000, 'Feb transaction should be the salary');
  });
});
